  phagocytic:        [Cd68, Lgals3, Trem2, Tyrobp, Axl, Itgax, Cst7, Lpl, Clec7a, Cd9]
  nrf2_hmox1:        [Hmox1, Nqo1, Gclm, Gclc, Txnrd1, Srxn1, Fth1, Ftl1, Slc7a11, Sqstm1]
  apoc1_chemokine:   [Apoc1, Apoe, Ccl2, Ccl3, Ccl4, Ccl5, Cxcl10, Cxcl16, Spp1, Lyz2]

# Used only for the optional "restrict" step (keep microglia-rich spots as query spots).
microglia_markers: [P2ry12, Tmem119, Cx3cr1, Csf1r, Hexb, Sall1]
