# !!! PLACEHOLDER GENE LISTS - REPLACE WITH YOUR OWN PROGRAMME MODULES !!!
# These are generic, commonly used microglia markers written from general knowledge so the
# pipeline runs end-to-end. They are NOT the gene modules from your pseudobulk analysis.
# Paste the real lists for your four programmes (mouse gene symbols, case-sensitive).
# Rule of thumb: >= 8-10 genes per programme, and report how many are detected (the run
# writes programme_gene_coverage.csv).
programs:
